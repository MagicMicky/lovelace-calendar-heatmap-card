name: Release

on:
  push:
    branches:
      - main

# Never let two releases run at once - semantic-release is not safe to race.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          # Use a Personal Access Token to allow semantic-release to push changes
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          # Remove cache option until we have a lock file
          # cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Add a linting step with continue-on-error
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # Build once here purely to fail fast on a broken build. The artifact that
      # actually ships is rebuilt inside semantic-release's prepare step, after
      # scripts/update-version.js has stamped the new version into the sources.
      - name: Build (validation only)
        run: npm run build

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx semantic-release
